name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC (npmjs trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      # This package ships precompiled JS (dist/), so build it before publishing.
      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
